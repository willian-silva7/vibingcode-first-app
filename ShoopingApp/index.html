<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoopingApp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">FRUIT SHOP</div>

        <nav class="nav" aria-label="Main menu">
          <button class="nav-button active" type="button" data-page="products" title="Browse all fruit products">Products</button>
          <button class="nav-button" type="button" data-page="details" title="View the selected product details">Product Details</button>
          <button class="nav-button" type="button" data-page="cart" title="Review and adjust your shopping cart">Shopping Cart</button>
          <button class="nav-button" type="button" data-page="checkout" title="Proceed to checkout">Checkout</button>
        </nav>

        <div class="sidebar-meta" aria-label="Store summary">
          <span>10 fruits</span>
          <span>Fresh delivery</span>
          <span>Seasonal picks</span>
        </div>
      </aside>

      <main class="content">
        <div id="page-root" aria-live="polite"></div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
  </body>
</html>
